name: CI

on: [push, pull_request]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generated files in sync with ext_api.py
        run: python3 apps/common/gen_ext.py --check

      - name: Frontend syntax check
        run: cp frontend/main.js /tmp/main_check.mjs && node --check /tmp/main_check.mjs

      - name: Codegen sanity (modeling)
        run: |
          python3 -c "import ast; [ast.parse(open(f).read()) for f in ( \
            'modeling/notebooks/base_codegen.py', \
            'modeling/notebooks/model/quad_codegen.py', \
            'modeling/notebooks/model/rocket_codegen.py', \
            'modeling/notebooks/model/mpc_codegen.py')]"

      - name: Build native core server
        run: |
          cmake -S apps/ws-served/server -B build-server -DCMAKE_BUILD_TYPE=Release
          cmake --build build-server

      - name: Plant machinery tests (native)
        run: |
          cmake -S plants/test -B build-plants-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-plants-test
          ./build-plants-test/driver
          ./build-plants-test/sitl_driver

      - name: Control solver + MPC model tests (native)
        run: |
          cmake -S libs/control/test -B build-ilqr-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ilqr-test
          ./build-ilqr-test/ilqr_test
          cmake -S core/Models/test -B build-mpc-model-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-mpc-model-test
          ./build-mpc-model-test/mpc_model_test

      - name: Logger + profiler tests (native)
        run: |
          cmake -S libs/log/test -B build-log-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-log-test
          ./build-log-test/log_test
          cmake -S libs/profile/test -B build-profile-test -DCMAKE_BUILD_TYPE=Release
          cmake --build build-profile-test
          ./build-profile-test/profile_test

      - name: Solver C++/Python conformance certificate
        run: |
          cmake -S libs/control/bind -B build-ilqr-bind -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ilqr-bind
          python3 libs/control/bind/ilqr_conformance.py build-ilqr-bind

      - name: Protocol end-to-end test
        run: python3 apps/ws-served/test/test_protocol.py ./build-server/cds_server

  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.56

      - name: Build wasm-only app
        run: |
          emcmake cmake -S apps/wasm-only -B build-wasm-only -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm-only

      - name: Build ws-served client (WASM proxy)
        run: |
          emcmake cmake -S apps/ws-served/client -B build-ws-client -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ws-client
